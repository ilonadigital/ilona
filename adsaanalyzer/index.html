    <div class="r-main"><div class="r-t clamp1">${esc(i.nama)}</div><div class="r-s clamp1">${i.adOn ? '<span class="adtag">Diiklankan</span>' : ''}${itemSub(i)}<span class="show-s"> · ${gone ? '<span class="neg">sudah habis</span>' : 'habis ' + when}</span></div></div>
    <div class="r-cols"><div class="r-col"><span>Stok</span><b>${fN(i.eff)}</b></div><div class="r-col"><span>Laku / hari</span><b>${fD(i.demand)}</b></div><div class="r-col"><span>Habis</span><b class="${i.daysLeft < i.lead ? 'neg' : ''}">${when}</b></div></div>
    <div class="r-col strong"><span>Pesan</span><b>${fN(i.qty)} unit</b></div>${chev}</div>`;
}

function vIklan(){
  const ads = R.ads;
  if (!ads.length) return pageHead('Iklan') + emptyImport('ads');
  const cnt = countBy(ads,'st');
  const ord = ['SCALE','PERTAHANKAN','RUGI','DATA KURANG'];
  const sorter = {profit:(a,b) => b.profit - a.profit, cost:(a,b) => b.cost - a.cost, roas:(a,b) => b.roas - a.roas, loss:(a,b) => a.profit - b.profit}[UI.adSort];
  const fk = k => ads.filter(a => a.flag && a.flag.k === k).length, nH = fk('HOLD'), nP = fk('PUSH');
  const rows = ads.filter(a => UI.adF === 'ALL' || a.st === UI.adF || (a.flag && a.flag.k === UI.adF)).sort(sorter);
  const opts = [{k:'ALL',l:'Semua',n:ads.length}, ...ord.filter(k => cnt[k]).map(k => ({k, l:ST[k].l, n:cnt[k]}))];
  if (nH) opts.push({k:'HOLD', l:'Stok kritis', n:nH});
  if (nP) opts.push({k:'PUSH', l:'Stok berlebih', n:nP});
  return `${pageHead('Iklan', 'Profit sebenarnya & keputusan scale atau stop untuk setiap iklan')}
  <div class="grid g4" style="margin-bottom:28px">
    ${ord.map(k => { const g = ads.filter(a => a.st === k); return metric(pill(k), `${g.length} <span style="font-size:15px;color:var(--label-3);font-weight:500">iklan</span>`, `${fRpS(sum(g,a=>a.cost))} budget · profit ${fRpS(sum(g,a=>a.profit))}`, '', `data-seg="adF|${UI.adF === k ? 'ALL' : k}"`).replace('class="metric tap"', `class="metric tap ${UI.adF === k ? 'on' : ''}"`); }).join('')}
  </div>
  ${nH && UI.adF !== 'HOLD' ? `<div class="callout">${ic('warn',18)}<div><b>${nH} iklan untung, tapi stok produknya kritis.</b> Menaikkan budget sekarang hanya mempercepat stok habis — restock dulu. <button class="btn link" data-seg="adF|HOLD" style="padding:0">Lihat</button></div></div>` : ''}
  <div class="toolbar">
    ${seg('adF', UI.adF, opts)}
    <span class="spacer"></span>
    ${sortSel('adSort', [['profit','Profit tertinggi'],['loss','Rugi terbesar'],['cost','Biaya terbesar'],['roas','ROAS tertinggi']])}
  </div>
  <div class="ads">${rows.map(a => `<div class="card adc" data-sheet="ad|${a.idx}" role="button" tabindex="0">
      <div class="adc-top"><span class="pills">${pill(a.st)}${flagPill(a.flag)}</span><span class="cap clamp1">${esc(a.mode)}${a.paused ? ' · Dijeda' : ''}</span></div>
      <h3 class="clamp2">${esc(a.name)}</h3>
      <div class="lbl">Profit bersih</div>
      <div class="big ${sgn(a.profit)}">${plus(a.profit)}${fRp(a.profit)}</div>
      ${gauge(a.roas, a.bep, a.st)}
      ${a.tgt && modeKind(a.mode) === 'roas' ? `<div class="tgt" data-tip="${esc(tgtAdvice(a))}"><span>${ic('target',16,2)}Target ROAS GMV Max</span><b>${fT(a.tgt.rec)}</b></div>` : ''}
      <div class="stats">
        <div><span>Biaya</span><b>${fRpS(a.cost)}</b></div><div><span>Omzet</span><b>${fRpS(a.rev)}</b></div>
        <div><span>CTR</span><b class="${a.views && a.ctr < S.ctrMin ? 'neg' : ''}">${fPct(a.ctr,2)}</b></div><div><span>CVR</span><b class="${a.clicks && a.cvr < S.cvrMin ? 'neg' : ''}">${fPct(a.cvr,2)}</b></div>
      </div>
      <div class="advice c-${ST[a.st].c}">${ic('bulb',17)}<span>${esc(a.act)}</span></div>
    </div>`).join('') || '<div class="empty">Tidak ada iklan untuk filter ini.</div>'}</div>
  ${targetList(ads)}
  ${modeTable(ads)}`;
}
const flagPill = f => !f ? '' : f.k === 'HOLD'
  ? `<span class="pill c-orange" data-tip="Stok produk ini kritis — menaikkan budget mempercepat stok habis">${ic('warn',12,2.4)}Stok kritis</span>`
  : `<span class="pill c-blue" data-tip="Stok cukup ±${fN(Math.round(f.g.days))} hari — iklan bisa didorong">${ic('box',12,2.4)}Stok berlebih</span>`;
const flagChip = f => !f ? '' : f.k === 'HOLD'
  ? `<div class="flag c-orange">${ic('warn',15,2)}<span>Stok kritis — tahan scale</span></div>`
  : `<div class="flag c-blue">${ic('box',15,2)}<span>Stok berlebih ±${fN(Math.round(f.g.days))} hari — dorong iklan</span></div>`;
function targetList(ads){
  const rows = ads.filter(a => a.tgt).sort((a,b) => b.cost - a.cost);
  const cand = R.cand.filter(p => p.tgt).slice(0, 6);
  if (!rows.length && !cand.length) return '';
  const row = (name, sub, roas, tg, attrs) => `<div class="row tap" ${attrs}>
    <div class="r-main"><div class="r-t clamp1">${esc(name)}</div><div class="r-s clamp1">${sub}<span class="show-s"> · impas ${fT(tg.min)}</span></div></div>
    <div class="r-cols"><div class="r-col"><span>ROAS aktual</span><b>${roas}</b></div><div class="r-col"><span>Batas impas</span><b>${fT(tg.min)}</b></div></div>
    <div class="r-end" style="min-width:110px"><span class="r-s">Target ROAS</span><b class="tgt-n">${fT(tg.rec)}</b></div>${chev}</div>`;
  return `<h2 class="sec">Target ROAS siap pakai <small>untuk GMV Max</small></h2>
  ${rows.length ? `<div class="list">${rows.map(a => row(a.name, esc(a.mode) + (a.mapped ? '' : ' · HPP default') + (a.flag && a.flag.k === 'HOLD' ? ' · <span class="neg">stok kritis</span>' : ''), fX(a.roas), a.tgt, `data-sheet="ad|${a.idx}"`)).join('')}</div>` : ''}
  ${cand.length ? `<h3 class="sub">Produk layak diiklankan</h3><div class="list">${cand.map(p => row(p.nama, `Belum diiklankan · CVR ${fPct(p.cvr)}`, '—', p.tgt, `data-sheet="prod|${esc(p.kode)}"`)).join('')}</div>` : ''}
  <p class="foot">Target = titik impas × (1 + buffer ${fPct(+S.buffer,0)}), dibulatkan ke atas. Isi angka ini di kolom <b>Target ROAS</b> saat membuat atau mengubah iklan GMV Max. Di bawah batas impas, setiap penjualan dari iklan merugi.</p>`;
}
function modeTable(ads){
  const modes = [...new Set(ads.map(a => a.mode))].map(m => { const g = ads.filter(a => a.mode === m); const c = sum(g,a=>a.cost), r = sum(g,a=>a.rev); return {m, c, r, roas: c > 0 ? r/c : 0, p: sum(g,a=>a.profit), n:g.length}; }).sort((a,b) => b.c - a.c);
  return `<h2 class="sec">Per mode iklan</h2><div class="list">${modes.map(x => `<div class="row">
    <div class="r-main"><div class="r-t">${esc(x.m)}</div><div class="r-s">${x.n} iklan · biaya ${fRpS(x.c)} · ROAS ${fX(x.roas)}</div></div>
    <div class="r-end"><b class="${sgn(x.p)}">${fRp(x.p)}</b><span class="r-s">profit bersih</span></div></div>`).join('')}</div>`;
}

function vProduk(){
  const ps = R.products;
  if (!ps.length) return pageHead('Produk') + emptyImport('prod');
  const ord = ['SCALE','PERTAHANKAN','RUGI','DATA KURANG','BELUM DIIKLANKAN','TIDAK ADA PENJUALAN'];
  const cnt = countBy(ps,'st'), q = UI.prQ.toLowerCase();
  const sorter = {profit:(a,b) => b.profit - a.profit, sales:(a,b) => b.sales - a.sales, spend:(a,b) => b.spend - a.spend, name:(a,b) => a.nama.localeCompare(b.nama)}[UI.prSort];
  const rows = ps.filter(p => (UI.prF === 'ALL' || p.st === UI.prF || (UI.prF === 'CAND' && p.cand)) && (!q || (p.nama + ' ' + p.kode).toLowerCase().includes(q))).sort(sorter);
  const lim = limit('prod');
  const top = ps.slice().sort((a,b) => b.sales - a.sales).slice(0,10), topShare = sum(top, p => p.sales) / (R.tot.sales || 1);
  const opts = [{k:'ALL',l:'Semua',n:ps.length}, ...ord.filter(k => cnt[k]).map(k => ({k, l: k === 'RUGI' ? 'Rugi' : ST[k].l, n:cnt[k]}))];
  if (R.cand.length) opts.push({k:'CAND', l:'Layak diiklankan', n:R.cand.length});
  return `${pageHead('Produk', `Profit bersih per produk setelah biaya iklan. 10 produk teratas = ${fPct(topShare,0)} penjualan toko.`)}
  ${R.cand.length && UI.prF !== 'CAND' ? `<div class="callout info">${ic('sparkles',18)}<div><b>${R.cand.length} produk layak mulai diiklankan.</b> Sudah laku, konversi di atas ${fPct(+S.cvrMin)}, dan margin positif — tapi belum ada iklan. <button class="btn link" data-seg="prF|CAND" style="padding:0">Lihat</button></div></div>` : ''}
  <div class="toolbar">${seg('prF', UI.prF, opts)}</div>
  <div class="toolbar">${searchBox('prQ','Cari produk')}<span class="spacer"></span>${sortSel('prSort', [['profit','Profit'],['sales','Penjualan'],['spend','Biaya iklan'],['name','Nama']])}</div>
  <div class="list">${rows.slice(0, lim).map(p => `<div class="row tap" data-sheet="prod|${esc(p.kode)}">
    <div class="r-main"><div class="r-t clamp1">${esc(p.nama)}</div><div class="r-s clamp1">${fRpS(p.sales)} penjualan · HPP ${fPct(p.hpp,0)}${p.hppSet ? '' : ' (default)'}</div></div>
    <div class="r-cols"><div class="r-col"><span>Biaya iklan</span><b>${p.spend ? fRpS(p.spend) : '—'}</b></div><div class="r-col"><span>ROAS / BEP</span><b>${p.spend ? fX(p.roas) : '—'} <span style="display:inline;font-size:12px;color:var(--label-3)">/ ${fX(p.bep)}</span></b></div><div class="r-col"><span>TACOS</span><b>${fPct(p.tacos)}</b></div></div>
    <div class="r-end"><b class="${sgn(p.profit)}">${fRpS(p.profit)}</b>${pill(p.st, true)}</div>${chev}</div>`).join('') || '<div class="empty">Tidak ada produk yang cocok.</div>'}
  ${more('prod', rows.length, lim)}</div>`;
}

function vStok(){
  const it = R.items;
  if (!it.length) return pageHead('Stok & Restock') + emptyImport('prod');
  const cnt = countBy(it,'st'), need = R.priority;
  const order = ['HABIS','KRITIS','SEGERA RESTOCK','AMAN','OVERSTOCK','STOK DIAM','STOK BELUM DIISI','TIDAK ADA PENJUALAN','NONAKTIF'];
  const withDays = it.filter(i => i.daysLeft !== null);
  let body;
  if (UI.stTab === 'pri'){
    body = need.length ? `<div class="list">${need.slice(0, limit('pri')).map(priRow).join('')}${more('pri', need.length, limit('pri'))}</div>
      <p class="foot">Urut dari sisa hari stok paling sedikit. Merah = sudah habis, oranye = habis sebelum barang restock tiba (lead time), kuning = di bawah reorder point.</p>`
      : `<div class="list"><div class="row ind"><span class="r-ic" style="--c:var(--${R.stockFilled ? 'green' : 'gray'})">${ic(R.stockFilled ? 'check' : 'stack',18,2)}</span><div class="r-main"><div class="r-t">${R.stockFilled ? 'Tidak ada yang perlu direstock' : 'Stok belum diisi'}</div><div class="r-s">${R.stockFilled ? 'Semua SKU berada di atas reorder point.' : 'Isi stok saat ini per SKU untuk menghitung forecast.'}</div></div>${R.stockFilled ? '' : '<button class="btn sm primary" data-go="inputstok">Isi stok</button>'}</div></div>`;
  } else {
    const q = UI.stQ.toLowerCase();
    const sorter = {urg:(a,b) => order.indexOf(a.st) - order.indexOf(b.st) || ((a.daysLeft ?? 1e9) - (b.daysLeft ?? 1e9)), days:(a,b) => (a.daysLeft ?? 1e9) - (b.daysLeft ?? 1e9), sold:(a,b) => b.units - a.units}[UI.stSort];
    const rows = it.filter(i => (UI.stF === 'ALL' || i.st === UI.stF) && (!q || (i.nama + ' ' + i.vname + ' ' + i.sku + ' ' + i.key).toLowerCase().includes(q))).sort(sorter);
    const lim = limit('fc');
    body = `<div class="card" style="margin-bottom:16px">${storage(order.filter(k => cnt[k]).map(k => ({l:ST[k].l, v:cnt[k], c:cvar(k), t:fN(cnt[k])})))}</div>
    <div class="toolbar">${searchBox('stQ','Cari SKU atau produk')}
      <select class="select" data-sel="stF"><option value="ALL">Semua status</option>${order.filter(k => cnt[k]).map(k => `<option value="${k}" ${UI.stF === k ? 'selected' : ''}>${ST[k].l} (${cnt[k]})</option>`).join('')}</select>
      <span class="spacer"></span>${sortSel('stSort', [['urg','Paling mendesak'],['days','Sisa hari'],['sold','Terlaris']])}</div>
    <div class="list">${rows.slice(0, lim).map(i => `<div class="row tap" data-sheet="item|${esc(i.key)}">
      <div class="r-main"><div class="r-t clamp1">${esc(i.nama)}</div><div class="r-s clamp1">${itemSub(i)}</div></div>
      <div class="r-cols"><div class="r-col"><span>Terjual</span><b>${fN(i.units)}</b></div><div class="r-col"><span>Stok</span><b>${i.eff === null ? '—' : fN(i.eff)}</b></div><div class="r-col"><span>Sisa hari</span><b>${fD(i.daysLeft)}</b></div></div>
      <div class="r-end">${pill(i.st)}<span class="r-s">${i.daysLeft !== null ? fD(i.daysLeft) + ' hari' : i.units ? fD(i.demand) + '/hari' : ''}</span></div>${chev}</div>`).join('') || '<div class="empty">Tidak ada SKU yang cocok.</div>'}
    ${more('fc', rows.length, lim)}</div>`;
  }
  return `${pageHead('Stok & Restock', `Forecast dari penjualan ${R.days} hari${+S.growth ? ` + ${fPct(+S.growth,0)} kenaikan` : ''} · acuan ${fDate(R.ref)}`,
      need.length ? `<button class="btn" data-act="csvRestock">${ic('dl',17)} Daftar restock</button>` : '')}
  ${R.stockFilled ? '' : `<div class="callout">${ic('warn',18)}<div>Stok belum diisi untuk SKU mana pun, jadi forecast belum bisa dihitung. <button class="btn link" data-go="inputstok" style="padding:0">Isi stok sekarang</button></div></div>`}
  <div class="grid g4" style="margin-bottom:28px">
    ${metric('Perlu restock', `${need.length} <span style="font-size:15px;color:var(--label-3);font-weight:500">SKU</span>`, `${cnt.HABIS || 0} habis · ${cnt.KRITIS || 0} kritis · ${cnt['SEGERA RESTOCK'] || 0} segera`, need.length ? 'neg' : '')}
    ${metric('Total dipesan', `${fN(sum(need, i => i.qty))} <span style="font-size:15px;color:var(--label-3);font-weight:500">unit</span>`, 'Untuk SKU prioritas')}
    ${metric('Modal restock', fRpS(sum(need, i => i.modal)), 'Estimasi dari HPP')}
    ${metric('Rata-rata sisa stok', `${fD(withDays.length ? sum(withDays, i => i.daysLeft) / withDays.length : NaN)} <span style="font-size:15px;color:var(--label-3);font-weight:500">hari</span>`, `${(cnt.OVERSTOCK || 0) + (cnt['STOK DIAM'] || 0)} SKU overstock / diam`)}
  </div>
  <div class="toolbar">${seg('stTab', UI.stTab, [{k:'pri', l:'Prioritas restock', n:need.length}, {k:'all', l:'Semua SKU', n:it.length}])}</div>
  ${body}`;
}

function vRiwayat(){
  const L = histList();
  const head = sub => pageHead('Riwayat', sub, R.snap ? `<button class="btn" data-act="report">${ic('doc',17)} Ekspor PDF</button>` : '');
  if (!L.length) return head('Perbandingan bulan ke bulan') + `<div class="card" style="text-align:center;padding:52px 24px">
    <div class="r-ic" style="--c:var(--purple);width:56px;height:56px;border-radius:15px;margin:0 auto 16px">${ic('chart',28,2)}</div>
    <h3 style="margin:0 0 6px;font-size:19px;font-weight:650">Belum ada riwayat</h3>
    <p class="cap" style="max-width:400px;margin:0 auto 18px;font-size:14px">Setiap laporan yang diimpor tersimpan otomatis per periode. Impor laporan bulan ini, lalu bulan depan — perbandingannya muncul di sini.</p>
    <button class="btn primary" data-act="import">Impor laporan</button></div>`;

  const keys = L.map(s => s.key);
  let ia = keys.indexOf(UI.hA); if (ia < 0) ia = R.snap ? keys.indexOf(R.snap.key) : keys.length - 1; if (ia < 0) ia = keys.length - 1;
  let ib = keys.indexOf(UI.hB); if (ib < 0 || ib === ia) ib = ia > 0 ? ia - 1 : (L.length > 1 ? ia + 1 : -1);
  const cur = L[Math.max(ia, ib)], prev = ib >= 0 ? L[Math.min(ia, ib)] : null;
  const v = (s, k) => !s ? null : ['sales','net','tacos','orders','units'].includes(k) ? (s.hasProd ? s.tot[k] : null) : (s.hasAds ? s.tot[k] : null);
  const opt = sel => L.map(s => `<option value="${s.key}" ${s.key === sel ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
  const pick = L.length > 1 ? `<div class="toolbar"><select class="select" data-sel="hA" aria-label="Periode">${opt(keys[ia])}</select><span class="cap">dibandingkan dengan</span><select class="select" data-sel="hB" aria-label="Periode pembanding">${opt(keys[ib])}</select></div>` : '';

  const tile = (l, k, fmt, kind, good, signed) => { const c = v(cur, k), p = v(prev, k);
    return metric(l, c == null ? '—' : fmt(c), prev ? (p == null ? `${esc(prev.label)}: —` : `<div class="vs" style="margin-top:2px">${dl(c, p, kind, good)}<span>dari ${fmt(p)}</span></div>`) : esc(cur.label), signed && c != null ? sgn(c) : ''); };
  const tiles = `<div class="grid g3" style="margin-bottom:16px">
    ${tile('Profit bersih iklan', 'adProfit', fRpS, 'rp', 1, true)}
    ${tile('Penjualan toko', 'sales', fRpS, 'rel', 1)}
    ${tile('Profit bersih toko', 'net', fRpS, 'rp', 1, true)}
    ${tile('Biaya iklan', 'spend', fRpS, 'rel', 0)}
    ${tile('ROAS iklan', 'roas', fX, 'x', 1)}
    ${tile('TACOS', 'tacos', x => fPct(x), 'pp', -1)}
  </div>`;

  const H = L.slice(-12), hi = [cur.key, prev && prev.key].filter(Boolean);
  const chart = (title, sub, k, fmt, color, tick) => `<div class="card"><h2 class="sec" style="margin:0 0 2px;font-size:17px">${title}</h2><p class="cap" style="margin:0">${sub}</p>
    ${barChart(H.map(s => ({key:s.key, x:s.short || s.label, v: v(s,k) ?? 0, t: tick ? v(s, tick) : null,
      tip: `${s.label}\n${title}: ${v(s,k) == null ? '—' : fmt(v(s,k))}${tick && v(s,tick) ? `\nTitik impas: ${fX(v(s,tick))}` : ''}`})), {fmt, color, hi, label: !tick})}
    ${tick ? `<div class="bch-leg"><span><i></i>ROAS</span><span><i class="tk"></i>Titik impas</span></div>` : ''}</div>`;
  const charts = L.length > 1 ? `<div class="grid g2" style="margin-top:20px">
    ${chart('Profit bersih iklan', 'Setelah HPP, potongan & PPN', 'adProfit', fRpS, x => x >= 0 ? 'var(--green)' : 'var(--red)')}
    ${chart('Penjualan toko', 'Total penjualan per periode', 'sales', fRpS, () => 'var(--blue)')}
    ${chart('ROAS & titik impas', 'Batang di atas garis = iklan untung', 'roas', fX, () => 'var(--blue)', 'bep')}
    ${chart('Biaya iklan', 'Total biaya iklan sebelum PPN', 'spend', fRpS, () => 'var(--blue)')}
  </div>` : '';

  let compare = '';
  if (prev && prev.hasAds && cur.hasAds){
    const ca = new Map(cur.ads.map(a => [a.id, a])), pa = new Map(prev.ads.map(a => [a.id, a]));
    const scaled = prev.ads.filter(a => a.st === 'SCALE');
    const verdict = (p, c) => !c ? ['gray','Tidak aktif'] : c.cost <= p.cost * 1.05 ? ['gray','Budget tidak dinaikkan'] : c.profit > p.profit ? ['green','Berhasil'] : ['orange','Profit tidak naik'];
    const dRow = (name, sub, d, end) => `<div class="row"><div class="r-main"><div class="r-t clamp1">${esc(name)}</div><div class="r-s">${sub}</div></div><div class="r-end">${d}${end || ''}</div></div>`;
    const dv = d => `<b class="${sgn(d)}">${plus(d)}${fRpS(d)}</b>`;
    if (scaled.length){
      const ok = scaled.filter(p => verdict(p, ca.get(p.id))[1] === 'Berhasil').length;
      compare += `<h2 class="sec">Apakah scale di ${esc(prev.label)} berhasil? <small>${ok} dari ${scaled.length} iklan profitnya naik</small></h2>
      <div class="list">${scaled.sort((a,b) => b.profit - a.profit).map(p => { const c = ca.get(p.id), [vc, vl] = verdict(p, c);
        return dRow(p.name, c ? `Biaya ${fRpS(p.cost)} → ${fRpS(c.cost)} · ROAS ${fX(p.roas)} → ${fX(c.roas)}` : `Tidak ada di laporan ${esc(cur.label)}`,
          c ? dv(c.profit - p.profit) : '<b>—</b>', `<span class="pill c-${vc}"><span class="pd"></span>${vl}</span>`); }).join('')}</div>
      <p class="foot">Berhasil = biaya dinaikkan dan profit bersih ikut naik. Kalau biaya naik tapi profit tidak, ROAS turun terlalu jauh — kembalikan budget atau naikkan target ROAS.</p>`;
    }
    const ids = [...new Set([...prev.ads.map(a => a.id), ...cur.ads.map(a => a.id)])];
    const rows = ids.map(id => { const p = pa.get(id), c = ca.get(id); return {p, c, x: c || p, d: (c ? c.profit : 0) - (p ? p.profit : 0)}; }).sort((a,b) => Math.abs(b.d) - Math.abs(a.d));
    compare += `<h2 class="sec">Perubahan per iklan <small>${esc(prev.label)} → ${esc(cur.label)}</small></h2>
    <div class="list">${rows.map(r => dRow(r.x.name,
      r.p && r.c ? `<span class="chg">${pill(r.p.st)}<span class="arr">→</span>${pill(r.c.st)}<span class="cap">ROAS ${fX(r.p.roas)} → ${fX(r.c.roas)}</span></span>` : r.c ? `<span class="chg">${pill(r.c.st)}<span class="cap">Baru di ${esc(cur.label)}</span></span>` : `Tidak ada di ${esc(cur.label)}`,
      dv(r.d), '<span class="r-s">perubahan profit</span>')).join('')}</div>`;
  }
  if (prev && prev.hasProd && cur.hasProd){
    const pp = new Map(prev.prods.map(p => [p.kode, p])), cp = new Map(cur.prods.map(p => [p.kode, p]));
    const mv = [...new Set([...pp.keys(), ...cp.keys()])].map(k => { const a = pp.get(k), b = cp.get(k); return {nama: (b || a).nama, a, b, d: (b ? b.profit : 0) - (a ? a.profit : 0)}; });
    const up = mv.filter(x => x.d > 0).sort((x,y) => y.d - x.d).slice(0,5), dn = mv.filter(x => x.d < 0).sort((x,y) => x.d - y.d).slice(0,5);
    const lst = arr => arr.length ? `<div class="list">${arr.map(x => `<div class="row"><div class="r-main"><div class="r-t clamp1">${esc(x.nama)}</div><div class="r-s">Penjualan ${fRpS(x.a ? x.a.sales : 0)} → ${fRpS(x.b ? x.b.sales : 0)}</div></div><div class="r-end"><b class="${sgn(x.d)}">${plus(x.d)}${fRpS(x.d)}</b></div></div>`).join('')}</div>` : `<div class="list"><div class="empty" style="padding:24px">Tidak ada</div></div>`;
    compare += `<h2 class="sec">Produk dengan perubahan profit terbesar</h2><div class="grid g2"><div><h3 class="sub" style="margin-top:0">Naik</h3>${lst(up)}</div><div><h3 class="sub" style="margin-top:0">Turun</h3>${lst(dn)}</div></div>`;
  }

  const saved = `<h2 class="sec">Periode tersimpan <small>${L.length} periode</small></h2><div class="list">${L.slice().reverse().map(s => { const act = R.snap && s.key === R.snap.key;

  return `${head(prev ? `${esc(cur.label)} dibandingkan ${esc(prev.label)}` : 'Perbandingan bulan ke bulan')}

  ${!prev ? `<div class="callout info">${ic('calendar',18)}<div><b>Baru ada 1 periode (${esc(cur.label)}).</b> Bulan depan, pilih <b>Mulai periode baru</b> lalu impor laporan berikutnya — perbandingan bulan ke bulan akan muncul otomatis di sini.</div></div>` : ''}
  ${tiles}${charts}${compare}${saved}`;
}

    <tbody>${cand.map(p => `<tr><td>${esc(p.nama)}</td><td>${fRpS(p.sales)}</td><td>${fPct(p.cvr)}</td><td>${fPct(p.margin,0)}</td><td><b style="color:var(--accent-ink)">${p.tgt ? fT(p.tgt.rec) : '—'}</b></td></tr>`).join('')}</tbody></table></div>`;

      HPP diisi untuk ${R.hppFilled} dari ${R.products.length} produk; stok diisi untuk ${R.stockFilled} dari ${R.items.length} SKU. Sumber: ${[RAW.adsFile, RAW.prodFile].filter(Boolean).map(esc).join(' & ')}.</div>

function targetGroup(tg, roas, note){

function stockGroup(g, flag){
  return `<div class="fgroup"><div class="ftitle">Stok produk ini</div><div class="form">${kv('Sisa stok (semua variasi)', g.days === null ? '—' : `±${fD(g.days)} hari`, g.days !== null && g.days < +S.leadTime ? 'neg' : '')}${kv('SKU habis / kritis', `${g.urg.length} dari ${g.n} SKU`, g.urg.length ? 'neg' : '')}</div>

const SHEETS = {
  ad(id){
    const a = R.ads[+id]; if (!a) return null;
    return { head: `<div style="flex:1;min-width:0"><div style="margin-bottom:8px">${pill(a.st)}</div><h3>${esc(a.name)}</h3><div class="cap">${esc(a.mode)}${a.paused ? ' · Dijeda' : ''}${a.prodName !== a.name ? ' · ' + esc(a.prodName) : ''}</div></div>`,
      live: () => { const a = R.ads[+id];
        return `<div class="card" style="margin-top:8px">${a.flag ? flagChip(a.flag).replace('class="flag', 'style="margin:0 0 14px" class="flag') : ''}<div class="bigstat" style="text-align:left;padding:0"><div class="cap">Profit bersih</div><div class="v ${sgn(a.profit)}">${plus(a.profit)}${fRp(a.profit)}</div></div>${gauge(a.roas, a.bep, a.st)}
          <div class="advice c-${ST[a.st].c}">${ic('bulb',17)}<span>${esc(a.act)}</span></div></div>
        ${targetGroup(a.tgt, a.roas, tgtAdvice(a) + (a.mapped ? '' : ' Dihitung dengan HPP default.'))}
        ${a.stock ? stockGroup(a.stock, a.flag) : ''}
        ${group('Hitungan profit', kv('Omzet iklan', fRp(a.rev)) + kv(`HPP ${fPct(a.hpp,0)} + potongan ${fPct(R.pot,0)}`, fRp(-a.rev * (1 - a.margin))) + kv(`Biaya iklan + PPN ${fPct(+S.ppn,0)}`, fRp(-a.costPpn)) + kv('<b style="color:var(--label)">Profit bersih</b>', fRp(a.profit), sgn(a.profit)), esc(a.note))}
        ${group('Kinerja', kv('ROAS', fX(a.roas)) + kv('BEP ROAS (impas)', fX(a.bep)) + kv('Batas scale', fX(a.bep * (1 + +S.buffer))) + kv('ACOS', fPct(a.acos)) + kv('Margin sebelum iklan', fPct(a.margin), a.margin <= 0 ? 'neg' : ''))}
        ${group('Funnel', kv('Dilihat', fN(a.views)) + kv('Klik', fN(a.clicks)) + kv('CTR', fPct(a.ctr,2), a.views && a.ctr < S.ctrMin ? 'neg' : '') + kv('Pesanan', fN(a.conv)) + kv('CVR', fPct(a.cvr,2), a.clicks && a.cvr < S.cvrMin ? 'neg' : '') + kv('Produk terjual', fN(a.sold)) + kv('Biaya per klik', fRp(a.cpc)))}`; },
      inputs: a.prod ? hppInputs(a.prod.kode) : '' };

async function loadFile(file, kind){
  try{
    const rows = trimRows(await readTable(file, kind));
    if (kind === 'ads'){
      const p = parseAds(rows); if (!p.ads.length) throw new Error('Tidak ada baris iklan di file ini');
      RAW.ads = rows; RAW.adsFile = file.name;
      toast(`${p.ads.length} iklan diimpor${p.period ? ' · ' + fPeriod(p.period) : ''}`);
    } else {
      const p = parseProd(rows); if (!p.parents.length) throw new Error('Tidak ada produk di file ini');
      RAW.prod = rows; RAW.prodFile = file.name;
      toast(`${p.parents.length} produk · ${p.items.length} SKU diimpor`);
    }
    if (!/-contoh\./.test(file.name)){ let n = 0; Object.keys(HIST).forEach(k => { if (HIST[k].demo){ delete HIST[k]; n++; } }); if (n) LS.set('hist', HIST); }
    LS.set('raw', RAW); render(); refreshSheet();
    if (!$('#onb').classList.contains('hidden')) renderOnb();
  } catch(e){ console.error(e); toast(e.message, false); }
}
async function importStock(file){
  try{
    let rows;
    if (/\.(csv|txt)$/i.test(file.name)) rows = parseCSV(await file.text());
    else { const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}); }
    const hi = rows.findIndex(r => r.some(c => /^stok/i.test(T(c))));
    if (hi < 0) throw new Error('Kolom “Stok” tidak ditemukan — gunakan template');
    const h = rows[hi].map(c => T(c).toLowerCase());
    const iStok = h.findIndex(c => c.startsWith('stok') && !c.includes('jalan'));
    const iOtw = h.findIndex(c => c.includes('jalan') || c.includes('otw'));
    const iLead = h.findIndex(c => c.includes('lead'));
    const iCode = h.findIndex(c => /sku|kode|id/.test(c));
    if (iCode < 0) throw new Error('Kolom kode (SKU / Kode Variasi / Kode Produk) tidak ditemukan');
    const idx = new Map();
    R.items.forEach(it => { [it.varId, it.sku, it.kode].forEach((k,j) => { if (k && k !== '-' && !(j === 1 && it.dup) && !(j === 2 && it.varId !== '-')) idx.set(k, it.key); }); });
    let ok = 0, miss = 0;
    for (const r of rows.slice(hi + 1)){
      const c = code(r[iCode]); if (!c) continue;
      const key = idx.get(c); if (!key){ miss++; continue; }
      const o = STOCK[key] || (STOCK[key] = {});
      if (T(r[iStok]) !== '') o.stok = num(r[iStok]);
      if (iOtw >= 0 && T(r[iOtw]) !== '') o.otw = num(r[iOtw]);
      if (iLead >= 0 && T(r[iLead]) !== '') o.lead = num(r[iLead]);
      ok++;
    }
    LS.set('stock', STOCK); render();
    toast(`Stok ${ok} SKU diperbarui${miss ? ` · ${miss} kode tidak cocok` : ''}`);
  } catch(e){ toast(e.message, false); }
}
function download(name, text, type = 'text/csv'){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type + ';charset=utf-8'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  const prodRows = [hdr], stock = {}, hpp = {};
  P.forEach(([nama, price, vars, h], i) => {
    const kode = String(23000000000 + i * 7919 * 13), units = sales[i], orders = Math.round(units * 0.85);
    const views = Math.round(units * (40 + rnd() * 60)) + 400, clicks = Math.round(views * (0.04 + rnd() * 0.06));
    prodRows.push([kode, nama, 'Normal', '-', '-', '-', '-', 'SKU-' + (i+1), units * price, Math.round(units*0.95) * price, views, clicks, orders, Math.round(orders*0.95), units, Math.round(units*0.95)]);
    if (i % 3 !== 2) hpp[kode] = i % 2 ? {pct:h} : {rp: Math.round(price * h / 500) * 500};
    if (vars){
      const w = vars.map(() => 0.4 + rnd()); const ws = w.reduce((a,b) => a+b, 0);
      vars.forEach((v, j) => {
        const vid = String(180000000000 + i * 1000 + j), sku = 'SKU-' + (i+1) + '-' + String(j+1).padStart(2,'0'), u = Math.round(units * w[j] / ws);
        prodRows.push([kode, nama, 'Normal', vid, v, i === 3 && j === 2 ? 'Dihapus' : 'Normal', sku, '', u * price, Math.round(u*0.95) * price, '-', '-', '-', '-', u, Math.round(u*0.95)]);
        const daily = u / 31, r = rnd();
        const d = r < 0.12 ? 0 : r < 0.3 ? 4 + rnd()*8 : r < 0.45 ? 16 + rnd()*5 : r < 0.85 ? 25 + rnd()*50 : 100 + rnd()*80;
        if (!(i === 7 && j === 2)) stock[vid] = {stok: Math.round(daily * d) + (u === 0 ? 12 : 0), otw: r > 0.2 && r < 0.3 ? Math.round(daily * 10) : null, lead: i === 6 ? 21 : null};
      });
    } else stock[kode] = {stok: i === 9 ? 0 : i === 8 ? 140 : i === 4 ? Math.round(units / 31 * 125) : Math.round(units / 31 * (10 + rnd() * 30)), otw:null, lead:null};
  });
  const adHdr = ['Urutan','Nama Iklan','Status','Jenis Iklan','Kode Produk','Tampilan Iklan','Mode Bidding','Penempatan Iklan','Tanggal Mulai','Tanggal Selesai','Dilihat','Jumlah Klik','Persentase Klik','Konversi','Produk Terjual','Omzet Penjualan','Biaya'];
  const lines = [['Semua Laporan Iklan CPC - Shopee Indonesia'], ['Nama Toko','Toko Contoh Hijab'], ['Periode','01/10/2026 - 31/10/2026'], [], adHdr];
  [[0,'GMV Max ROAS','Berjalan',1900000,11.5],[1,'Iklan Manual','Berjalan',2400000,6.9],[1,'GMV Max ROAS','Berjalan',900000,9.8],[2,'Iklan Manual','Berjalan',1100000,3.1],
   [3,'Iklan Manual','Dijeda',650000,2.4],[4,'GMV Max Auto','Berjalan',380000,12.4],[5,'Iklan Manual','Berjalan',820000,2.2],[6,'Iklan Manual','Berjalan',540000,3.6],
   [7,'GMV Max ROAS','Berjalan',30000,8],['-','Iklan Produk Otomatis','Berjalan',1250000,4.2],[9,'Iklan Manual','Berjalan',210000,5.1],[8,'Iklan Manual','Berjalan',300000,1.6]
  ].forEach(([pi, mode, st, cost, roas], n) => {
    const kode = pi === '-' ? '-' : prodRows.find(r => r[1] === P[pi][0])[0];
    const rev = Math.round(cost * roas), price = pi === '-' ? 90000 : P[pi][1];
    const sold = Math.max(1, Math.round(rev / price)), conv = Math.round(sold * 0.9);
    const clicks = Math.round(conv / (pi === 4 ? 0.012 : 0.025 + rnd() * 0.04)), views = Math.round(clicks / (n === 6 ? 0.007 : 0.015 + rnd() * 0.03));
    lines.push([n+1, pi === '-' ? 'Iklan Produk Otomatis' : P[pi][0], st, 'Iklan Produk', kode, '-', mode, 'Semua Penempatan', '01/10/2026', 'Tidak Terbatas', views, clicks, '', conv, sold, rev, cost]);
  });
  RAW = {ads: trimRows(parseCSV(lines.map(csvRow).join('\n'))), prod: trimRows(prodRows), adsFile:'Data_Keseluruhan_Iklan_Shopee-contoh.csv', prodFile:'parentskudetail-contoh.xlsx'};
  HPP = hpp; STOCK = stock; S.refDate = '2026-11-01';
  R = compute(); const cur = makeSnap(R); HIST = cur ? demoHistory(cur) : {};
  LS.set('raw', RAW); LS.set('settings', S); LS.set('hpp', HPP); LS.set('stock', STOCK); LS.set('hist', HIST);
  go('ringkasan'); toast('Data contoh dimuat');
}

// two earlier months for the demo, derived from the current demo period so the numbers stay coherent
function demoHistory(cur){
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ppn = +S.ppn, buf = +S.buffer, out = {};
  [['2026-08-01','2026-08-31','Agu 2026','Agu 26',31,0.74],['2026-09-01','2026-09-30','Sep 2026','Sep 26',30,0.88]].forEach(([start, end, label, short, days, f]) => {
    const ads = cur.ads.map(a => {
      const m = a.rev > 0 ? (a.profit + a.cost * (1 + ppn)) / a.rev : 0.3;
      const cost = Math.round(a.cost * f * (0.7 + rnd() * 0.55)), rev = Math.round(a.rev * f * (0.65 + rnd() * 0.6)), roas = cost > 0 ? rev / cost : 0;
      const st = cost < S.minSpend ? 'DATA KURANG' : !a.bep ? 'RUGI' : roas >= a.bep * (1 + buf) ? 'SCALE' : roas >= a.bep ? 'PERTAHANKAN' : 'RUGI';
      return Object.assign({}, a, {cost, rev, roas, profit: rev * m - cost * (1 + ppn), st, m});
    });
    const prods = cur.prods.map(p => {
      const mp = p.sales > 0 ? (p.profit + p.spend * (1 + ppn)) / p.sales : 0, g = f * (0.8 + rnd() * 0.4);
      const sales = Math.round(p.sales * g), spend = Math.round(p.spend * f * (0.75 + rnd() * 0.5));
      return Object.assign({}, p, {sales, units: Math.round(p.units * g), spend, profit: sales * mp - spend * (1 + ppn)});
    });
    const spend = sum(ads, a => a.cost), adRev = sum(ads, a => a.rev), contrib = sum(ads, a => a.rev * a.m), sales = sum(prods, p => p.sales), k = sales / (cur.tot.sales || 1);
    const unmapped = sum(ads.filter(a => !a.kode || a.kode === '-'), a => a.cost * (1 + ppn));
    ads.forEach(a => delete a.m);
    out[start + '_' + end] = { key: start + '_' + end, start, end, label, short, shop: cur.shop, demo: true, saved: new Date().toISOString(), days, hasAds: true, hasProd: true,
      tot: { sales, orders: Math.round(cur.tot.orders * k), units: Math.round(cur.tot.units * k), spend, adRev, adProfit: sum(ads, a => a.profit), net: sum(prods, p => p.profit) - unmapped,
        roas: spend ? adRev / spend : 0, bep: contrib > 0 ? adRev * (1 + ppn) / contrib : null, tacos: sales ? spend / sales : 0, acos: adRev ? spend / adRev : 0, adShare: sales ? adRev / sales : 0 },
      n: countBy(ads, 'st'), ads, prods };
  });
  out[cur.key] = cur;
  return out;
}

/* ============================== events ============================== */
$('#fAds').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'ads'); e.target.value = ''; };
$('#fProd').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'prod'); e.target.value = ''; };
$('#fStock').onchange = e => { if (e.target.files[0]) importStock(e.target.files[0]); e.target.value = ''; };
$('#fBackup').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!d || d.app !== 'ads-profit-analyzer') throw new Error('Bukan file backup aplikasi ini');
    S = Object.assign({}, DEFAULTS, d.settings || {}); HPP = d.hpp || {}; STOCK = d.stock || {}; if (d.hist) HIST = d.hist; LS.set('settings',S); LS.set('hpp',HPP); LS.set('stock',STOCK); LS.set('hist',HIST); render(); refreshSheet(); toast('Backup dipulihkan'); }
  catch(err){ toast(err.message, false); }
};
document.addEventListener('click', e => {
  const dh = e.target.closest('[data-delhist]'); if (dh){ const k = dh.dataset.delhist, s = HIST[k]; if (s && confirm(`Hapus ringkasan periode ${s.label} dari riwayat?`)){ delete HIST[k]; LS.set('hist', HIST); render(); } return; }
  const a = e.target.closest('[data-act]'); if (a){ ACTS[a.dataset.act](); return; }
  const d = e.target.closest('[data-drop]'); if (d){ (d.dataset.drop === 'ads' ? $('#fAds') : $('#fProd')).click(); return; }
  const sh = e.target.closest('[data-sheet]'); if (sh){ const [t, ...rest] = sh.dataset.sheet.split('|'); openSheet(t, rest.join('|')); return; }
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); if (SHEET) closeSheet(); go(g.dataset.go, g.dataset.f ? JSON.parse(g.dataset.f) : null); return; }
  const s = e.target.closest('[data-seg]'); if (s){ const [k,v] = s.dataset.seg.split('|'); UI[k] = v; renderView(); return; }
  const m = e.target.closest('[data-more]'); if (m){ UI.lim[m.dataset.more] = 1e9; renderView(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#rpt').classList.contains('hidden')){ closeReport(); return; }
  if (e.key === 'Escape' && SHEET) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-sheet]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('input[data-hpp],input[data-stk]')){
    const attr = e.target.dataset.hpp ? 'hpp' : 'stk', f = e.target.dataset[attr].split('|')[1];
    const all = [...document.querySelectorAll(`input[data-${attr}$="|${f}"]`)], i = all.indexOf(e.target);
    if (all[i+1]){ all[i+1].focus(); all[i+1].select(); } else e.target.blur();
  }
});
let qT;
document.addEventListener('input', e => {
  const q = e.target.dataset.q; if (!q) return;
  UI[q] = e.target.value; clearTimeout(qT);
  qT = setTimeout(() => { const pos = e.target.selectionStart; renderView(); const el = document.querySelector(`[data-q="${q}"]`); if (el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } }, 160);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel){ UI[t.dataset.sel] = t.value; renderView(); return; }
  if (t.dataset.tg){ UI[t.dataset.tg] = t.checked; renderView(); return; }
  if (t.dataset.hpp){
    const [k,f] = t.dataset.hpp.split('|'); const o = HPP[k] || (HPP[k] = {});
    const v = T(t.value) === '' ? null : num(t.value);
    o[f] = v === null ? null : (f === 'pct' ? v / 100 : v);
    if (!isNum(o.pct) && !isNum(o.rp)) delete HPP[k];
    t.closest('.fin') && t.closest('.fin').classList.toggle('set', v !== null);
    LS.set('hpp', HPP); render(true);
    const p = R.pMap.get(k), der = document.querySelector(`[data-der="${CSS.escape(k)}"]`);
    if (p && der) der.textContent = hppDer(p);
    if (SHEET){ refreshSheet(); DIRTY = true; }
    return;
  }
  if (t.dataset.stk){
    const [k,f] = t.dataset.stk.split('|'); const o = STOCK[k] || (STOCK[k] = {});
    o[f] = T(t.value) === '' ? null : num(t.value);
    if (!isNum(o.stok) && !isNum(o.otw) && !isNum(o.lead)) delete STOCK[k];
    t.closest('.fin') && t.closest('.fin').classList.toggle('set', T(t.value) !== '');
    LS.set('stock', STOCK); render(true);
    const it = R.items.find(x => x.key === k), cell = document.querySelector(`[data-ist="${CSS.escape(k)}"]`);
    if (it && cell) cell.innerHTML = pill(it.st);
    if (SHEET){ refreshSheet(); DIRTY = true; }
    return;
  }
  if (t.dataset.set){
    const [k,type] = t.dataset.set.split('|'); const raw = T(t.value);
    if (type === 'pct') S[k] = raw === '' ? DEFAULTS[k] : num(raw) / 100;
    else if (type === 'num') S[k] = raw === '' ? (k === 'periodOverride' ? '' : DEFAULTS[k]) : num(raw);
    else S[k] = raw;
    LS.set('settings', S); render(true);
    const tot = [...document.querySelectorAll('.frow.total span')][1]; if (tot) tot.textContent = fPct(R.pot);
  }
});
// drag & drop anywhere
let dragN = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragN++; });
document.addEventListener('dragover', e => { e.preventDefault(); const d = e.target.closest('[data-drop]'); document.querySelectorAll('[data-drop]').forEach(x => x.classList.toggle('over', x === d)); });
document.addEventListener('dragleave', () => { if (--dragN <= 0){ dragN = 0; document.querySelectorAll('[data-drop]').forEach(x => x.classList.remove('over')); } });
document.addEventListener('drop', e => {
  e.preventDefault(); dragN = 0; document.querySelectorAll('[data-drop]').forEach(x => x.classList.remove('over'));
  const d = e.target.closest('[data-drop]');
  [...(e.dataTransfer && e.dataTransfer.files || [])].forEach(f => loadFile(f, d ? d.dataset.drop : (/\.csv$/i.test(f.name) || /iklan/i.test(f.name) ? 'ads' : 'prod')));
});
// tooltip (pointer devices only)
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el || !el.dataset.tip){ tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 10;
  if (y + h > innerHeight - 8) y = e.clientY - h - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('scroll', () => { tip.style.opacity = 0; }, true);

/* ============================== boot ============================== */
try{ const th = localStorage.getItem('apa_theme'); if (th) document.documentElement.dataset.theme = th; }catch(e){}
try{ const v = sessionStorage.getItem('apa_view'); if (v) VIEW = v; }catch(e){}
render();
if (!S.onboarded) showOnb();
