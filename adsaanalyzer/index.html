function vRiwayat(){
  const L = histList();
  const head = sub => pageHead('Riwayat', sub, R.snap ? `<button class="btn" data-act="report">${ic('doc',17)} Ekspor PDF</button>` : '');
  if (!L.length) return head('Perbandingan bulan ke bulan') + `<div class="card" style="text-align:center;padding:52px 24px">
    <div class="r-ic" style="--c:var(--purple);width:56px;height:56px;border-radius:15px;margin:0 auto 16px">${ic('chart',28,2)}</div>
    <h3 style="margin:0 0 6px;font-size:19px;font-weight:650">Belum ada riwayat</h3>
    <p class="cap" style="max-width:400px;margin:0 auto 18px;font-size:14px">Setiap laporan yang diimpor tersimpan otomatis per periode. Impor laporan bulan ini, lalu bulan depan — perbandingannya muncul di sini.</p>
    <button class="btn primary" data-act="import">Impor laporan</button></div>`;

  const keys = L.map(s => s.key);
  let ia = keys.indexOf(UI.hA); if (ia < 0) ia = R.snap ? keys.indexOf(R.snap.key) : keys.length - 1; if (ia < 0) ia = keys.length - 1;
  let ib = keys.indexOf(UI.hB); if (ib < 0 || ib === ia) ib = ia > 0 ? ia - 1 : (L.length > 1 ? ia + 1 : -1);
  const cur = L[Math.max(ia, ib)], prev = ib >= 0 ? L[Math.min(ia, ib)] : null;
  const v = (s, k) => !s ? null : ['sales','net','tacos','orders','units'].includes(k) ? (s.hasProd ? s.tot[k] : null) : (s.hasAds ? s.tot[k] : null);
  const opt = sel => L.map(s => `<option value="${s.key}" ${s.key === sel ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
  const pick = L.length > 1 ? `<div class="toolbar"><select class="select" data-sel="hA" aria-label="Periode">${opt(keys[ia])}</select><span class="cap">dibandingkan dengan</span><select class="select" data-sel="hB" aria-label="Periode pembanding">${opt(keys[ib])}</select></div>` : '';

  const tile = (l, k, fmt, kind, good, signed) => { const c = v(cur, k), p = v(prev, k);
    return metric(l, c == null ? '—' : fmt(c), prev ? (p == null ? `${esc(prev.label)}: —` : `<div class="vs" style="margin-top:2px">${dl(c, p, kind, good)}<span>dari ${fmt(p)}</span></div>`) : esc(cur.label), signed && c != null ? sgn(c) : ''); };
  const tiles = `<div class="grid g3" style="margin-bottom:16px">
    ${tile('Profit bersih iklan', 'adProfit', fRpS, 'rp', 1, true)}
    ${tile('Penjualan toko', 'sales', fRpS, 'rel', 1)}
    ${tile('Profit bersih toko', 'net', fRpS, 'rp', 1, true)}
    ${tile('Biaya iklan', 'spend', fRpS, 'rel', 0)}
    ${tile('ROAS iklan', 'roas', fX, 'x', 1)}
    ${tile('TACOS', 'tacos', x => fPct(x), 'pp', -1)}
  </div>`;

  const H = L.slice(-12), hi = [cur.key, prev && prev.key].filter(Boolean);
  const chart = (title, sub, k, fmt, color, tick) => `<div class="card"><h2 class="sec" style="margin:0 0 2px;font-size:17px">${title}</h2><p class="cap" style="margin:0">${sub}</p>
    ${barChart(H.map(s => ({key:s.key, x:s.short || s.label, v: v(s,k) ?? 0, t: tick ? v(s, tick) : null,
      tip: `${s.label}\n${title}: ${v(s,k) == null ? '—' : fmt(v(s,k))}${tick && v(s,tick) ? `\nTitik impas: ${fX(v(s,tick))}` : ''}`})), {fmt, color, hi, label: !tick})}
    ${tick ? `<div class="bch-leg"><span><i></i>ROAS</span><span><i class="tk"></i>Titik impas</span></div>` : ''}</div>`;
  const charts = L.length > 1 ? `<div class="grid g2" style="margin-top:20px">
    ${chart('Profit bersih iklan', 'Setelah HPP, potongan & PPN', 'adProfit', fRpS, x => x >= 0 ? 'var(--green)' : 'var(--red)')}
    ${chart('Penjualan toko', 'Total penjualan per periode', 'sales', fRpS, () => 'var(--blue)')}
    ${chart('ROAS & titik impas', 'Batang di atas garis = iklan untung', 'roas', fX, () => 'var(--blue)', 'bep')}
    ${chart('Biaya iklan', 'Total biaya iklan sebelum PPN', 'spend', fRpS, () => 'var(--blue)')}
  </div>` : '';

  let compare = '';
  if (prev && prev.hasAds && cur.hasAds){
    const ca = new Map(cur.ads.map(a => [a.id, a])), pa = new Map(prev.ads.map(a => [a.id, a]));
    const scaled = prev.ads.filter(a => a.st === 'SCALE');
    const verdict = (p, c) => !c ? ['gray','Tidak aktif'] : c.cost <= p.cost * 1.05 ? ['gray','Budget tidak dinaikkan'] : c.profit > p.profit ? ['green','Berhasil'] : ['orange','Profit tidak naik'];
    const dRow = (name, sub, d, end) => `<div class="row"><div class="r-main"><div class="r-t clamp1">${esc(name)}</div><div class="r-s">${sub}</div></div><div class="r-end">${d}${end || ''}</div></div>`;
    const dv = d => `<b class="${sgn(d)}">${plus(d)}${fRpS(d)}</b>`;
    if (scaled.length){
      const ok = scaled.filter(p => verdict(p, ca.get(p.id))[1] === 'Berhasil').length;
      compare += `<h2 class="sec">Apakah scale di ${esc(prev.label)} berhasil? <small>${ok} dari ${scaled.length} iklan profitnya naik</small></h2>
      <div class="list">${scaled.sort((a,b) => b.profit - a.profit).map(p => { const c = ca.get(p.id), [vc, vl] = verdict(p, c);
        return dRow(p.name, c ? `Biaya ${fRpS(p.cost)} → ${fRpS(c.cost)} · ROAS ${fX(p.roas)} → ${fX(c.roas)}` : `Tidak ada di laporan ${esc(cur.label)}`,
          c ? dv(c.profit - p.profit) : '<b>—</b>', `<span class="pill c-${vc}"><span class="pd"></span>${vl}</span>`); }).join('')}</div>
      <p class="foot">Berhasil = biaya dinaikkan dan profit bersih ikut naik. Kalau biaya naik tapi profit tidak, ROAS turun terlalu jauh — kembalikan budget atau naikkan target ROAS.</p>`;
    }
    const ids = [...new Set([...prev.ads.map(a => a.id), ...cur.ads.map(a => a.id)])];
    const rows = ids.map(id => { const p = pa.get(id), c = ca.get(id); return {p, c, x: c || p, d: (c ? c.profit : 0) - (p ? p.profit : 0)}; }).sort((a,b) => Math.abs(b.d) - Math.abs(a.d));
    compare += `<h2 class="sec">Perubahan per iklan <small>${esc(prev.label)} → ${esc(cur.label)}</small></h2>
    <div class="list">${rows.map(r => dRow(r.x.name,
      r.p && r.c ? `<span class="chg">${pill(r.p.st)}<span class="arr">→</span>${pill(r.c.st)}<span class="cap">ROAS ${fX(r.p.roas)} → ${fX(r.c.roas)}</span></span>` : r.c ? `<span class="chg">${pill(r.c.st)}<span class="cap">Baru di ${esc(cur.label)}</span></span>` : `Tidak ada di ${esc(cur.label)}`,
      dv(r.d), '<span class="r-s">perubahan profit</span>')).join('')}</div>`;
  }
  if (prev && prev.hasProd && cur.hasProd){
    const pp = new Map(prev.prods.map(p => [p.kode, p])), cp = new Map(cur.prods.map(p => [p.kode, p]));
    const mv = [...new Set([...pp.keys(), ...cp.keys()])].map(k => { const a = pp.get(k), b = cp.get(k); return {nama: (b || a).nama, a, b, d: (b ? b.profit : 0) - (a ? a.profit : 0)}; });
    const up = mv.filter(x => x.d > 0).sort((x,y) => y.d - x.d).slice(0,5), dn = mv.filter(x => x.d < 0).sort((x,y) => x.d - y.d).slice(0,5);
    const lst = arr => arr.length ? `<div class="list">${arr.map(x => `<div class="row"><div class="r-main"><div class="r-t clamp1">${esc(x.nama)}</div><div class="r-s">Penjualan ${fRpS(x.a ? x.a.sales : 0)} → ${fRpS(x.b ? x.b.sales : 0)}</div></div><div class="r-end"><b class="${sgn(x.d)}">${plus(x.d)}${fRpS(x.d)}</b></div></div>`).join('')}</div>` : `<div class="list"><div class="empty" style="padding:24px">Tidak ada</div></div>`;
    compare += `<h2 class="sec">Produk dengan perubahan profit terbesar</h2><div class="grid g2"><div><h3 class="sub" style="margin-top:0">Naik</h3>${lst(up)}</div><div><h3 class="sub" style="margin-top:0">Turun</h3>${lst(dn)}</div></div>`;
  }

  const saved = `<h2 class="sec">Periode tersimpan <small>${L.length} periode</small></h2><div class="list">${L.slice().reverse().map(s => { const act = R.snap && s.key === R.snap.key;
    return `<div class="row"><div class="r-main"><div class="r-t">${esc(s.label)}${act ? ' <span class="pill c-blue" style="margin-left:6px;vertical-align:1px">Aktif</span>' : ''}</div><div class="r-s">${s.hasProd ? fRpS(s.tot.sales) + ' penjualan' : 'tanpa laporan produk'} · ${s.ads.length} iklan</div></div>
      <div class="r-end"><b class="${s.hasAds ? sgn(s.tot.adProfit) : ''}">${s.hasAds ? fRpS(s.tot.adProfit) : '—'}</b><span class="r-s">profit iklan</span></div>
      ${act ? '<span style="width:30px;flex:none"></span>' : `<button class="xbtn" data-delhist="${esc(s.key)}" aria-label="Hapus periode ${esc(s.label)}" data-tip="Hapus periode ini">${ic('trash',15,2)}</button>`}</div>`; }).join('')}</div>
    <p class="foot">Ringkasan tiap periode tersimpan otomatis saat laporan diimpor dan ikut diperbarui saat HPP diubah. Periode lama tidak berubah lagi setelah Anda mulai periode baru.</p>`;

  return `${head(prev ? `${esc(cur.label)} dibandingkan ${esc(prev.label)}` : 'Perbandingan bulan ke bulan')}
  ${pick}
  ${!prev ? `<div class="callout info">${ic('calendar',18)}<div><b>Baru ada 1 periode (${esc(cur.label)}).</b> Bulan depan, pilih <b>Mulai periode baru</b> lalu impor laporan berikutnya — perbandingan bulan ke bulan akan muncul otomatis di sini.</div></div>` : ''}
  ${tiles}${charts}${compare}${saved}`;
}

async function loadFile(file, hint){
  try{
    const got = await readAny(file, hint), kind = got.kind, rows = trimRows(got.rows);
    if (kind === 'ads'){
      const p = parseAds(rows); if (!p.ads.length) throw new Error('Tidak ada baris iklan di file ini');
      RAW.ads = rows; RAW.adsFile = file.name;
      toast(`${p.ads.length} iklan diimpor${p.period ? ' · ' + fPeriod(p.period) : ''}`);
    } else if (kind === 'prod'){
      const p = parseProd(rows); if (!p.parents.length) throw new Error('Tidak ada produk di file ini');
      RAW.prod = rows; RAW.prodFile = file.name;
      toast(`${p.parents.length} produk · ${p.items.length} SKU diimpor`);
    } else if (kind === 'inc'){
      const p = parseInc(rows); if (!p || !p.n) throw new Error('Tidak ada pesanan di laporan penghasilan ini');
      p.file = file.name; INC = p; SL.set('inc', INC);
      toast(`Laporan penghasilan: ${fN(p.n)} pesanan · ${fRpS(p.total)} dana cair`);
    } else {
      const p = parseOrd(rows); if (!p || !p.n) throw new Error('Tidak ada pesanan di file ini');
      p.file = file.name; ORD = p; SL.set('ord', ORD);
      toast(`${fN(p.n)} pesanan diimpor · ${fN(p.st.Batal.n)} batal · ${fN(p.st.Retur.n)} retur`);
    }
    if (!/-contoh\./.test(file.name)) purgeDemo();
    if (kind === 'ads' || kind === 'prod') SL.set('raw', RAW);
    render(); refreshSheet();
    if (!$('#onb').classList.contains('hidden')) renderOnb();
  } catch(e){ console.error(e); toast(e.message, false); }
}
function purgeDemo(){
  let n = 0; Object.keys(HIST).forEach(k => { if (HIST[k].demo){ delete HIST[k]; n++; } }); if (n) SL.set('hist', HIST);
  if (EXP.some(e => e.demo)){ EXP = EXP.filter(e => !e.demo); SL.set('exp', EXP); }

async function importStock(file){
  try{
    let rows;
    if (/\.(csv|txt)$/i.test(file.name)) rows = parseCSV(await file.text());
    else { const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''}); }
    const hi = rows.findIndex(r => r.some(c => /^stok/i.test(T(c))));
    if (hi < 0) throw new Error('Kolom “Stok” tidak ditemukan — gunakan template');
    const h = rows[hi].map(c => T(c).toLowerCase());
    const iStok = h.findIndex(c => c.startsWith('stok') && !c.includes('jalan'));
    const iOtw = h.findIndex(c => c.includes('jalan') || c.includes('otw'));
    const iLead = h.findIndex(c => c.includes('lead'));
    const iCode = h.findIndex(c => /sku|kode|id/.test(c));
    if (iCode < 0) throw new Error('Kolom kode (SKU / Kode Variasi / Kode Produk) tidak ditemukan');
    const idx = new Map();
    R.items.forEach(it => { [it.varId, it.sku, it.kode].forEach((k,j) => { if (k && k !== '-' && !(j === 1 && it.dup) && !(j === 2 && it.varId !== '-')) idx.set(k, it.key); }); });
    let ok = 0, miss = 0;
    for (const r of rows.slice(hi + 1)){
      const c = code(r[iCode]); if (!c) continue;
      const key = idx.get(c); if (!key){ miss++; continue; }
      const o = STOCK[key] || (STOCK[key] = {});
      if (T(r[iStok]) !== '') o.stok = num(r[iStok]);
      if (iOtw >= 0 && T(r[iOtw]) !== '') o.otw = num(r[iOtw]);
      if (iLead >= 0 && T(r[iLead]) !== '') o.lead = num(r[iLead]);
      ok++;
    }
    SL.set('stock', STOCK); render();
    toast(`Stok ${ok} SKU diperbarui${miss ? ` · ${miss} kode tidak cocok` : ''}`);
  } catch(e){ toast(e.message, false); }
}

async function saveFile(name, data, type = 'text/csv', done = ''){

    try{
      if (DLNS === undefined) DLNS = await window.claude.use('downloads');
      if (!DLNS){ toast('Simpan file tidak tersedia di tampilan ini', false); return false; }
      await DLNS.save({filename: name, data});
      if (done) toast(done); return true;
    }catch(e){
      const c = e && e.code;
      if (c === 'declined') return false;
      toast(c === 'rate_limited' ? 'Masih ada jendela simpan yang terbuka — selesaikan dulu' : 'File tidak bisa disimpan di tampilan ini', false); return false;
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type: type + ';charset=utf-8'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

}

  EXP = [

    {id:'dx2', date:'2026-10-01', cat:'sewa', amt:2500000, note:'Sewa gudang', rec:true, demo:true},
    {id:'dx3', date:'2026-10-08', cat:'packaging', amt:1800000, note:'Plastik, lakban & thank-you card', demo:true},
    {id:'dx4', date:'2026-10-12', cat:'iklanluar', amt:1200000, note:'Iklan Instagram', demo:true},
    {id:'dx5', date:'2026-10-15', cat:'stok', amt:25000000, note:'Restock gamis & pashmina', demo:true},
    {id:'dx6', date:'2026-10-20', cat:'income', amt:3000000, note:'Penjualan reseller offline', demo:true}];
  R = compute(); const t0 = R.tot;
  const wts = []; for (let d = 1; d <= 31; d++) wts.push(1 + 0.35 * Math.sin(d / 2.6) + (d === 10 || d === 25 ? 0.9 : 0) + rnd() * 0.25);
  const wsum = wts.reduce((a,b) => a + b, 0), odays = {};
  wts.forEach((w, i) => { const n = Math.round(t0.orders * w / wsum), v = Math.round(t0.sales * w / wsum); odays[`2026-10-${pad2(i+1)}`] = {n, v, bn: Math.round(n * 0.04), bv: Math.round(v * 0.04)}; });
  const oN = sum(Object.values(odays), d => d.n), oV = sum(Object.values(odays), d => d.v), ost = {};
  [['Selesai',.88],['Proses',.06],['Retur',.02],['Batal',.04]].forEach(([k,f]) => ost[k] = {n: Math.round(oN * f), v: Math.round(oV * f)});
  ORD = {file:'Order.all-contoh.xlsx', n:oN, v:oV, st:ost, days:odays, start:'2026-10-01', end:'2026-10-31'};
  const base = t0.sales * 0.94, iN = Math.round(t0.orders * 0.9);
  const fees = {admin: base * 0.065, layanan: base * 0.04, proses: iN * 1250, ams: base * 0.012, transaksi: 0, program: base * 0.015, kampanye: 0, lain: base * 0.002};
  Object.keys(fees).forEach(k => fees[k] = Math.round(fees[k]));
  INC = {file:'Income.dilepas-contoh.xlsx', n:iN, price: Math.round(base * 1.07), disc: Math.round(base * 0.07), refund: Math.round(base * 0.015), vouch: Math.round(base * 0.01), fees, days:{}, start:'2026-10-03', end:'2026-11-02'};
  INC.feeTot = sum(FEE_KEYS, k => fees[k]); INC.other = -Math.round(base * 0.004);
  INC.total = INC.price - INC.disc - INC.refund - INC.vouch - INC.feeTot + INC.other;
  R = compute(); const cur = makeSnap(R); HIST = cur ? demoHistory(cur) : {};
  saveAll();
  go('ringkasan'); toast('Data contoh dimuat');
}

// two earlier months for the demo, derived from the current demo period so the numbers stay coherent
function demoHistory(cur){
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ppn = +S.ppn, buf = +S.buffer, out = {};
  [['2026-08-01','2026-08-31','Agu 2026','Agu 26',31,0.74],['2026-09-01','2026-09-30','Sep 2026','Sep 26',30,0.88]].forEach(([start, end, label, short, days, f]) => {
    const ads = cur.ads.map(a => {
      const m = a.rev > 0 ? (a.profit + a.cost * (1 + ppn)) / a.rev : 0.3;
      const cost = Math.round(a.cost * f * (0.7 + rnd() * 0.55)), rev = Math.round(a.rev * f * (0.65 + rnd() * 0.6)), roas = cost > 0 ? rev / cost : 0;
      const st = cost < S.minSpend ? 'DATA KURANG' : !a.bep ? 'RUGI' : roas >= a.bep * (1 + buf) ? 'SCALE' : roas >= a.bep ? 'PERTAHANKAN' : 'RUGI';
      return Object.assign({}, a, {cost, rev, roas, profit: rev * m - cost * (1 + ppn), st, m});
    });
    const prods = cur.prods.map(p => {
      const mp = p.sales > 0 ? (p.profit + p.spend * (1 + ppn)) / p.sales : 0, g = f * (0.8 + rnd() * 0.4);
      const sales = Math.round(p.sales * g), spend = Math.round(p.spend * f * (0.75 + rnd() * 0.5));
      return Object.assign({}, p, {sales, units: Math.round(p.units * g), spend, profit: sales * mp - spend * (1 + ppn)});
    });
    const spend = sum(ads, a => a.cost), adRev = sum(ads, a => a.rev), contrib = sum(ads, a => a.rev * a.m), sales = sum(prods, p => p.sales), k = sales / (cur.tot.sales || 1);
    const unmapped = sum(ads.filter(a => !a.kode || a.kode === '-'), a => a.cost * (1 + ppn));
    ads.forEach(a => delete a.m);
    out[start + '_' + end] = { key: start + '_' + end, start, end, label, short, shop: cur.shop, demo: true, saved: new Date().toISOString(), days, hasAds: true, hasProd: true,
      tot: { sales, orders: Math.round(cur.tot.orders * k), units: Math.round(cur.tot.units * k), spend, adRev, adProfit: sum(ads, a => a.profit),
        net: sum(prods, p => p.profit) - unmapped - (cur.tot.opex || 0) * (0.9 + rnd() * 0.15) + (cur.tot.otherInc || 0) * rnd(),
        gp: (cur.tot.gp || 0) * k * (0.95 + rnd() * 0.04), fees: (cur.tot.fees || 0) * k, opex: cur.tot.opex || 0, aov: (cur.tot.aov || 0) * (0.93 + rnd() * 0.1), salesNet: (cur.tot.salesNet || sales) * k,
        roas: spend ? adRev / spend : 0, bep: contrib > 0 ? adRev * (1 + ppn) / contrib : null, tacos: sales ? spend / sales : 0, acos: adRev ? spend / adRev : 0, adShare: sales ? adRev / sales : 0 },
      n: countBy(ads, 'st'), ads, prods };
  });
  out[cur.key] = cur;
  return out;
}

/* ============================== events ============================== */
$('#fAds').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'ads'); e.target.value = ''; };
$('#fProd').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'prod'); e.target.value = ''; };
$('#fStock').onchange = e => { if (e.target.files[0]) importStock(e.target.files[0]); e.target.value = ''; };
$('#fInc').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'inc'); e.target.value = ''; };
$('#fOrd').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0], 'ord'); e.target.value = ''; };
$('#fStore').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!d || d.app !== 'ads-profit-analyzer') throw new Error('Bukan file toko dari aplikasi ini');
    let name = T(d.name) || T(d.settings && d.settings.shopName) || 'Toko impor';
    if (STORES.list.some(x => x.name === name)) name += ' (impor)';
    flushSnap(); const id = newStoreId(); STORES.list.push({id, name}); STORES.cur = id; saveStores();
    loadStoreData(); applyPack(d); S.onboarded = true; SL.set('settings', S); resetUI(); closeSheet(); go('ringkasan'); toast(`Toko “${name}” diimpor`); }
  catch(err){ toast(err.message, false); }
};
$('#fBackup').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!d || d.app !== 'ads-profit-analyzer') throw new Error('Bukan file backup aplikasi ini');
    applyPack(d); render(); refreshSheet(); toast('Backup dipulihkan'); }
  catch(err){ toast(err.message, false); }
};
document.addEventListener('click', e => {
  const dh = e.target.closest('[data-delhist]'); if (dh){ const k = dh.dataset.delhist, s = HIST[k]; if (s) ask(`Hapus periode ${s.label}?`, 'Ringkasan periode ini dihapus dari Riwayat.', 'Hapus', true).then(ok => { if (ok){ delete HIST[k]; SL.set('hist', HIST); render(); } }); return; }
  const de = e.target.closest('[data-delexp]'); if (de){ const x = EXP.find(y => y.id === de.dataset.delexp); if (x) ask('Hapus pengeluaran ini?', `“${x.note || (EXCAT[x.cat] || EXCAT.lain)[0]}” sebesar ${fRp(x.amt)}.`, 'Hapus', true).then(ok => { if (ok){ EXP = EXP.filter(y => y !== x); SL.set('exp', EXP); render(); } }); return; }
  const so = e.target.closest('[data-store]'); if (so){ if (so.dataset.store === STORES.cur){ closeSheet(); if (VIEW === 'semua') go('ringkasan'); } else switchStore(so.dataset.store); return; }
  const a = e.target.closest('[data-act]'); if (a){ ACTS[a.dataset.act](); return; }
  const d = e.target.closest('[data-drop]'); if (d){ $({ads:'#fAds', prod:'#fProd', inc:'#fInc', ord:'#fOrd'}[d.dataset.drop] || '#fProd').click(); return; }
  const sh = e.target.closest('[data-sheet]'); if (sh){ const [t, ...rest] = sh.dataset.sheet.split('|'); openSheet(t, rest.join('|')); return; }
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); if (SHEET) closeSheet(); go(g.dataset.go, g.dataset.f ? JSON.parse(g.dataset.f) : null); return; }
  const s = e.target.closest('[data-seg]'); if (s){ const [k,v] = s.dataset.seg.split('|');
    if (k === 'finBasis'){ if (v === 'income' && !INC){ toast('Impor laporan penghasilan dulu untuk basis dana cair', false); return; } S.finBasis = v; SL.set('settings', S); render(); return; }
    UI[k] = v; renderView(); return; }
  const m = e.target.closest('[data-more]'); if (m){ UI.lim[m.dataset.more] = 1e9; renderView(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#rpt').classList.contains('hidden')){ closeReport(); return; }
  if (e.key === 'Escape' && SHEET) closeSheet();
  if (e.key === 'Enter' && (e.target.id === 'exAmt' || e.target.id === 'exNote')){ e.preventDefault(); ACTS.addExp(); return; }
  if (e.key === 'Enter' && e.target.id === 'newStore'){ e.preventDefault(); ACTS.addStore(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-sheet]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('input[data-hpp],input[data-stk]')){
    const attr = e.target.dataset.hpp ? 'hpp' : 'stk', f = e.target.dataset[attr].split('|')[1];
    const all = [...document.querySelectorAll(`input[data-${attr}$="|${f}"]`)], i = all.indexOf(e.target);
    if (all[i+1]){ all[i+1].focus(); all[i+1].select(); } else e.target.blur();
  }
});
let qT;
document.addEventListener('input', e => {
  const q = e.target.dataset.q; if (!q) return;
  UI[q] = e.target.value; clearTimeout(qT);
  qT = setTimeout(() => { const pos = e.target.selectionStart; renderView(); const el = document.querySelector(`[data-q="${q}"]`); if (el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } }, 160);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel){ UI[t.dataset.sel] = t.value; renderView(); return; }
  if (t.dataset.tg){ UI[t.dataset.tg] = t.checked; renderView(); return; }
  if (t.dataset.hpp){
    const [k,f] = t.dataset.hpp.split('|'); const o = HPP[k] || (HPP[k] = {});
    const v = T(t.value) === '' ? null : num(t.value);
    o[f] = v === null ? null : (f === 'pct' ? v / 100 : v);
    if (!isNum(o.pct) && !isNum(o.rp)) delete HPP[k];
    t.closest('.fin') && t.closest('.fin').classList.toggle('set', v !== null);
    SL.set('hpp', HPP); render(true);
    const p = R.pMap.get(k), der = document.querySelector(`[data-der="${CSS.escape(k)}"]`);
    if (p && der) der.textContent = hppDer(p);
    if (SHEET){ refreshSheet(); DIRTY = true; }
    return;
  }
  if (t.dataset.stk){
    const [k,f] = t.dataset.stk.split('|'); const o = STOCK[k] || (STOCK[k] = {});
    o[f] = T(t.value) === '' ? null : num(t.value);
    if (!isNum(o.stok) && !isNum(o.otw) && !isNum(o.lead)) delete STOCK[k];
    t.closest('.fin') && t.closest('.fin').classList.toggle('set', T(t.value) !== '');
    SL.set('stock', STOCK); render(true);
    const it = R.items.find(x => x.key === k), cell = document.querySelector(`[data-ist="${CSS.escape(k)}"]`);
    if (it && cell) cell.innerHTML = pill(it.st);
    if (SHEET){ refreshSheet(); DIRTY = true; }
    return;
  }
  if (t.dataset.set){
    const [k,type] = t.dataset.set.split('|'); const raw = T(t.value);
    if (type === 'pct') S[k] = raw === '' ? DEFAULTS[k] : num(raw) / 100;
    else if (type === 'num') S[k] = raw === '' ? (k === 'periodOverride' ? '' : DEFAULTS[k]) : num(raw);
    else if (type === 'bool') S[k] = t.checked;
    else S[k] = raw;
    if (k === 'shopName' && T(raw)){ curStore().name = T(raw); saveStores(); }
    SL.set('settings', S); render(type !== 'bool');
    const tot = [...document.querySelectorAll('.frow.total span')][1]; if (tot) tot.textContent = fPct(R.pot);
  }
});
// drag & drop anywhere
let dragN = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragN++; });
document.addEventListener('dragover', e => { e.preventDefault(); const d = e.target.closest('[data-drop]'); document.querySelectorAll('[data-drop]').forEach(x => x.classList.toggle('over', x === d)); });
document.addEventListener('dragleave', () => { if (--dragN <= 0){ dragN = 0; document.querySelectorAll('[data-drop]').forEach(x => x.classList.remove('over')); } });
document.addEventListener('drop', e => {
  e.preventDefault(); dragN = 0; document.querySelectorAll('[data-drop]').forEach(x => x.classList.remove('over'));
  const d = e.target.closest('[data-drop]');
  [...(e.dataTransfer && e.dataTransfer.files || [])].forEach(f => loadFile(f, d ? d.dataset.drop : null));
});
// tooltip (pointer devices only)
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest('[data-tip]');
  if (!el || !el.dataset.tip){ tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip; tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 10;
  if (y + h > innerHeight - 8) y = e.clientY - h - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('scroll', () => { tip.style.opacity = 0; }, true);
